<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <title>비공개 문서</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: #1a3a5c;
      color: #1e2d3d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 38px 32px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.3);
      text-align: center;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .auth-card.shake { animation: shake 0.4s ease; }
    .auth-icon { font-size: 2.8rem; margin-bottom: 12px; }
    .auth-card h2 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #1a3a5c;
      margin-bottom: 22px;
      line-height: 1.5;
    }
    .auth-input {
      width: 100%;
      padding: 13px 16px;
      margin-bottom: 14px;
      border: 2px solid #d0dce9;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .auth-input:focus {
      border-color: #2e7dd6;
      box-shadow: 0 0 0 3px rgba(46, 125, 214, 0.2);
    }
    .auth-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #1a3a5c 0%, #2e7dd6 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .auth-btn:disabled { opacity: 0.6; cursor: wait; }
    .auth-msg {
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 20px;
      font-weight: 500;
      color: #e74c3c;
    }
    .auth-msg.info { color: #2e7dd6; }
  </style>
</head>
<body>
  <form class="auth-card" id="auth-form" autocomplete="on">
    <div class="auth-icon">🔒</div>
    <h2>열람을 위해 비밀번호를 입력해 주세요.</h2>
    <input type="text" name="username" value="resume" autocomplete="username" hidden>
    <input type="password" id="auth-password" class="auth-input" placeholder="비밀번호 입력" autofocus autocomplete="current-password" required>
    <button type="submit" id="auth-submit" class="auth-btn">확인</button>
    <div id="auth-msg" class="auth-msg" role="status" aria-live="polite"></div>
  </form>

    const SESSION_KEY = 'resume_unlocked_v' + PAYLOAD.v;

    const form = document.getElementById('auth-form');
    const input = document.getElementById('auth-password');
    const btn = document.getElementById('auth-submit');
    const msg = document.getElementById('auth-msg');

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function setMsg(text, info) {
      msg.textContent = text;
      msg.classList.toggle('info', !!info);
    }

    async function decrypt(password) {
      const baseKey = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64ToBytes(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
        baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: b64ToBytes(PAYLOAD.iv) }, key, b64ToBytes(PAYLOAD.ct));
      return new TextDecoder().decode(plain);
    }

    // 복호화된 문서로 페이지 전체를 교체 (원본의 <head> 스타일·제목·스크립트가 그대로 적용됨)
    function render(html) {
      document.open();
      document.write(html);
      document.close();
    }

    function sessionGet() {
      try { return sessionStorage.getItem(SESSION_KEY); } catch (e) { return null; }
    }
    function sessionSet(value) {
      try { sessionStorage.setItem(SESSION_KEY, value); } catch (e) { /* 저장 불가 환경은 무시 */ }
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const password = input.value;
      if (!password) { setMsg('비밀번호를 입력해 주세요.'); return; }

      btn.disabled = true;
      setMsg('잠금 해제 중...', true);
      let html = null;
      try { html = await decrypt(password); } catch (err) { html = null; }
      btn.disabled = false;

      if (html !== null) {
        sessionSet(html);
        render(html);
        return;
      }
      setMsg('비밀번호가 일치하지 않습니다. 다시 입력해 주세요.');
      input.value = '';
      input.focus();
      form.classList.remove('shake');
      void form.offsetWidth;
      form.classList.add('shake');
    });

    // 파싱 중에는 document.open()이 무시되므로 파싱 완료 후 실행
    document.addEventListener('DOMContentLoaded', function init() {
      if (!window.crypto || !crypto.subtle) {
        // Web Crypto는 https:// 와 file:// 에서만 동작 (http:// 원격 접속 시 불가)
        btn.disabled = true;
        input.disabled = true;
        setMsg('이 환경에서는 복호화를 지원하지 않습니다. https 주소 또는 로컬 파일로 열어 주세요.');
        return;
      }
      const cached = sessionGet();
      if (cached) render(cached);
    });
  </script>
